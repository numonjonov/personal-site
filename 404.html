<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Pahlavon Numonjonov</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='68' font-family='monospace' font-size='62' fill='%23fff' text-anchor='middle'>%3E_</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Страница статическая, без terminal.js — печатаем путь посимвольно
       вручную, тем же приёмом, что и настоящий терминал при загрузке. */
    .p404-path { white-space: pre; }
    .p404-caret {
      display: inline-block; width: 8px; height: 1em; margin-left: 2px;
      background: var(--accent); vertical-align: -2px;
      animation: p404-blink 1s steps(1) infinite;
    }
    @keyframes p404-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .p404-home { color: var(--accent); border-bottom: 1px solid var(--accent); }
    @media (prefers-reduced-motion: reduce) {
      .p404-caret { animation: none; }
    }
  </style>
</head>
<body>
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>

  <main class="window" id="window">
    <header class="win-bar">
      <span class="win-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="win-title">pahlavon@numonjonov.com — ~</span>

      <div class="win-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <div class="screen">
      <p class="line dim">pahlavon@numonjonov.com v1.0 — personal terminal</p>
      <div class="gap"></div>

      <p class="line cmd"><span class="p404-path" id="path"></span><span class="p404-caret" aria-hidden="true"></span></p>
      <p class="line err" id="notfound" style="visibility:hidden">command not found: <span id="pathecho"></span></p>
      <p class="line dim" id="hint" style="visibility:hidden">this page doesn't exist — <a class="p404-home" href="/">cd ~</a> to go home</p>
    </div>

    <footer class="status-bar">
      <span><span class="status-key">status</span> <b style="color:var(--accent)">404</b></span>
      <span class="status-clock" id="clock">--:--:--</span>
    </footer>
  </main>

  <script>
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);

    document.getElementById('theme-toggle').addEventListener('click', function () {
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    var clock = document.getElementById('clock');
    (function tick() {
      var d = new Date();
      var p = function (n) { return n < 10 ? '0' + n : String(n); };
      clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      setTimeout(tick, 1000);
    })();

    // Печатаем реальный путь, по которому пришёл посетитель — как команду
    var path = location.pathname + location.search;
    if (path.length > 40) path = path.slice(0, 37) + '...';

    var pathEl = document.getElementById('path');
    var echoEl = document.getElementById('pathecho');
    echoEl.textContent = path;

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function reveal() {
      document.getElementById('notfound').style.visibility = 'visible';
      document.getElementById('hint').style.visibility = 'visible';
      document.querySelector('.p404-caret').style.display = 'none';
    }

    if (reduceMotion) {
      pathEl.textContent = path;
      reveal();
    } else {
      var i = 0;
      (function type() {
        if (i <= path.length) {
          pathEl.textContent = path.slice(0, i++);
          setTimeout(type, 55);
          return;
        }
        reveal();
      })();
    }
  </script>
</body>
</html>
