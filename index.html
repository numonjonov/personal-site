<head>

  <meta property="og:title" content="Pahlavon Numonjonov" />
  <meta property="og:description" content="Personal website — about, experience, projects and contacts." />
  <meta property="og:type" content="website" />

  <!-- Полный адрес, не относительный путь — так надёжнее для всех сервисов.
       Версия в конце (?v=2) — на случай, если картинку когда-нибудь снова
       перерисуете: без неё Telegram и другие мессенджеры кэшируют картинку
       по адресу и не подхватывают новую, даже когда файл на сервере уже другой. -->
  <meta property="og:image" content="https://numonjonov.com/og.png?v=2" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pahlavon Numonjonov — personal terminal" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pahlavon Numonjonov" />
  <meta name="twitter:description" content="Personal website — about, experience, projects and contacts." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='68' font-family='monospace' font-size='62' fill='%23fff' text-anchor='middle'>%3E_</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#input" data-i18n="ui.skip">Skip to the command line</a>

  <canvas class="bg" id="bg" aria-hidden="true"></canvas>

  <main class="window" id="window">
    <!-- Заголовок окна -->
    <header class="win-bar">
      <span class="win-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="win-title" id="win-title">pahlavon@numonjonov.com — ~</span>

      <div class="win-actions">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
          <span class="lang-thumb" aria-hidden="true"></span>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="ru" lang="ru">RU</button>
          <button type="button" data-lang="uz" lang="uz">UZ</button>
        </div>

        <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="ui.themeLabel" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <!-- Экран вывода -->
    <div class="screen" id="screen" role="log" aria-live="polite" aria-label="Terminal output"></div>

    <!-- Подсказки -->
    <div class="hints" id="hints"></div>

    <!-- Строка ввода -->
    <form class="prompt" id="form" autocomplete="off">
      <label class="prompt-sign" for="input">$</label>
      <span class="prompt-field">
        <input id="input" class="prompt-input" type="text" spellcheck="false"
               autocapitalize="off" autocorrect="off"
               data-i18n-attr="placeholder|ui.placeholder"
               aria-label="Command" placeholder="type help and press enter" />
      </span>
    </form>

    <!-- Статусная строка -->
    <footer class="status-bar">
      <span><span class="status-key" data-i18n="ui.statusLang">lang</span> <b id="status-lang">en</b></span>
      <span><span class="status-key" data-i18n="ui.statusTheme">theme</span> <b id="status-theme">dark</b></span>
      <span class="status-bg"><span class="status-key" data-i18n="ui.statusBg">bg</span> <b id="status-bg">on</b></span>
      <span class="status-tip"><span class="status-key" data-i18n="ui.statusHint">try</span> <b>help</b></span>
      <span class="status-clock" id="clock">--:--:--</span>
    </footer>
  </main>

  <!-- Версия без JavaScript: то же содержимое обычным текстом -->
  <noscript>
    <div class="noscript">
      <h1>Pahlavon Numonjonov</h1>
      <p>Developer — one short line about what you do.</p>

      <h2>About</h2>

         you do and what you find interesting.</p>

        <li><b>2024 — now</b> — Your role, company or university.</li>
        <li><b>2023 — 2024</b> — Your role, company or university.</li>
        <li><b>2022 — 2023</b> — Where it started: course, school or first job.</li>
      </ul>

      <h2>Projects</h2>
      <ul>
        <li><b>Project name</b> — what problem it solves and what you built.</li>
        <li><b>Project name</b> — what problem it solves and what you built.</li>
        <li><b>Project name</b> — what problem it solves and what you built.</li>
      </ul>

      <h2>Skills</h2>
      <p>HTML, CSS, JavaScript, Python, Git, Figma.</p>

      <h2>Contact</h2>
      <p>Email: <a href="mailto:pahlavon@numonjonov.com">pahlavon@numonjonov.com</a><br />
         GitHub: <a href="https://github.com/numonjonov" rel="noopener">github.com/numonjonov</a><br />
         Telegram: <a href="https://t.me/CustomAnnotation" rel="noopener">t.me/CustomAnnotation</a></p>
    </div>
  </noscript>

  <script src="site.js"></script>
  <script src="bg.js"></script>
  <script src="i18n.js"></script>
  <script src="cursor.js"></script>
  <script src="terminal.js"></script>
  <script src="spoiler.js"></script>

</body>
